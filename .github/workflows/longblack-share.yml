name: Daily LongBlack Share

on:
  schedule:
    # 깃허브 액션의 크론탭은 UTC 기준입니다.
    # 한국 시간(KST) 오전 8시 30분에 작동시키려면 UTC 시간으로 23시 30분으로 설정합니다.
    - cron: '30 23 * * *'
  workflow_dispatch: # 레포지토리에서 수동으로 실행하고 싶을 때를 위한 버튼 활성화

jobs:
  share-article:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 레포지토리
        uses: actions/checkout@v4

      - name: Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'

      - name: 의존성 패키지 설치
        run: npm install

      - name: 크롤링 및 팀즈 발송 스크립트 실행
        env:
          # GitHub Secrets에 등록한 팀즈 웹훅 주소를 환경변수로 주입합니다.
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: node index.js
